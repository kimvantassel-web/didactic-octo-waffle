<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPRISE!</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FDF3F6;
      font-family: 'EB Garamond', Georgia, serif;
      color: #5C2C3B;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .dashboard {
      display: flex;
      width: 100%;
      max-width: 1100px;
      height: 88vh;
      align-items: center;
    }

    .panel {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 48px;
    }

    /* Typography */
    .overline {
      font-size: 15px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9A6B7A;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 25px;
      font-weight: 400;
      font-style: italic;
      color: #4A1E2C;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    h1 span {
      color: #A65E74;
    }

    .subtext {
      font-size: 18px;
      font-style: normal;
      color: #8C5868;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="panel">
        <div class="overline">HEY BITCH</div>
        <div><h1>Good afternoon, <span>Phillip.</span></h1></div>
        <div><p class="subtext">Boats & hoes.</p></div>
      </div>
    </div>

</body>
</html>
